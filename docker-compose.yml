version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: tfg_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootpassword}
      POSTGRES_DB: streaming_vod_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - vodeo-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vodeo-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - vodeo-network

  redis:
    image: redis:7-alpine
    container_name: vodeo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vodeo-network

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - USERS_HOST=users-service
      - CATALOG_HOST=catalog-service
      - STREAMING_HOST=streaming-service
    depends_on:
      - users-service
      - catalog-service
      - streaming-service
    networks:
      - vodeo-network

  users-service:
    build: ./users-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/streaming_vod_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-rootpassword}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en tu entorno o archivo .env (ver .env.example)}
      - VODEO_ADMIN_PASSWORD=${VODEO_ADMIN_PASSWORD:-admin1234}
    depends_on:
      - postgres-db
      - rabbitmq
    networks:
      - vodeo-network

  catalog-service:
    build: ./catalog-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/streaming_vod_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-rootpassword}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en tu entorno o archivo .env (ver .env.example)}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - OMDB_API_KEY=${OMDB_API_KEY}
    depends_on:
      - postgres-db
      - rabbitmq
      - redis
    networks:
      - vodeo-network

  streaming-service:
    build: ./streaming-service
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - VIDEOS_STORAGE_PATH=/vodeo-videos/
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en tu entorno o archivo .env (ver .env.example)}
    volumes:
      - ./data_videos:/vodeo-videos
    depends_on:
      - rabbitmq
    networks:
      - vodeo-network

  transcoding-service:
    build: ./transcoding-service
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - VIDEOS_STORAGE_PATH=/vodeo-videos/
    volumes:
      - ./data_videos:/vodeo-videos
    depends_on:
      - rabbitmq
    networks:
      - vodeo-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - vodeo-network

networks:
  vodeo-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data: