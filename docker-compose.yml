version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: tfg_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: streaming_vod_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: