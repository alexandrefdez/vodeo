server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "*"
      routes:
        - id: users-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/catalog/**

        - id: streaming-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/streaming/**