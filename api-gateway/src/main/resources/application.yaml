server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
      routes:
        - id: users-service
          uri: http://${USERS_HOST:localhost}:8081
          predicates:
            - Path=/api/users/**
        - id: catalog-service
          uri: http://${CATALOG_HOST:localhost}:8082
          predicates:
            - Path=/api/catalog/**
        - id: streaming-service
          uri: http://${STREAMING_HOST:localhost}:8083
          predicates:
            - Path=/api/streaming/**