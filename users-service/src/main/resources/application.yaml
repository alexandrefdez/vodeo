server:
  port: 8081

spring:
  application:
    name: users-service
  datasource:
    url: jdbc:postgresql://localhost:5433/streaming_vod_db
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000